name: Android CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    name: Mobile Unit & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mobile Unit Tests
        run: pnpm --filter ./mobile test

      - name: Check TypeScript Compilation
        run: pnpm --filter ./mobile exec tsc --noEmit

  build-release:
    name: Build Android Binaries & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Build Android Release APK & AAB
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk release-artifacts/opusflow-release.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab release-artifacts/opusflow-release.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release-artifacts/opusflow-release.apk
            release-artifacts/opusflow-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts for Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: opusflow-android-builds
          path: release-artifacts/
