services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opusflow}
      POSTGRES_DB: ${POSTGRES_DB:-opusflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opusflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://opusflow:opusflow@postgres:5432/opusflow?sslmode=disable}
      ARTWORK_DIR: /data/artwork
      # Confines the Libraries page's folder picker and the import source
      # browser to this one mount (see deploy/docker-compose.yml, which sets
      # this the same way). ./data is created on the host automatically if
      # it doesn't already exist — put your music there to import it.
      DATA_DIR: /data
    volumes:
      - artwork:/data/artwork
      - ./data:/data
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  artwork:
