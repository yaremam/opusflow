# Self-hosting stack (TDR 004): runs the prebuilt nightly image from GHCR —
# no repo clone, no Go/Node toolchain, no `build:`, no separate .env file.
# Every value you might need to change lives directly in this one file,
# marked "EDIT THIS" below — paste it as-is into Synology DSM's Container
# Manager ("Projects" → Create → paste docker-compose.yml), edit those
# lines, and deploy. See ../docs/deploy/synology.md for a full walkthrough.
#
# The three data volumes (pgdata, artwork, data) have no default path: they're
# written as ${VAR:?message} below, so `docker compose up` refuses to start
# and prints exactly what's missing until you replace each whole ${...}
# token with a real host path.
#
#   docker compose up -d          # start everything
#   docker compose pull && docker compose up -d   # update to newest nightly

services:
  app:
    image: ghcr.io/yaremam/opusflow:nightly
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: opusflow
      POSTGRES_DB: opusflow
      ARTWORK_DIR: /artwork
      # Confines the Libraries page's folder picker and the import source
      # browser to this one mount — not the host path you set below, always
      # this fixed container-side path, so leave it as /data.
      DATA_DIR: /data
    volumes:
      # ↓ EDIT THIS: where fetched/extracted artist photos and album covers
      # are cached on the host (e.g. /volume1/docker/opusflow/artwork on a
      # Synology). No default — replace the whole ${...} token with your
      # path, or the stack refuses to start and tells you so.
      - ${OPUSFLOW_ARTWORK_DIR:?set OPUSFLOW_ARTWORK_DIR to a host path for the artwork cache, e.g. /volume1/docker/opusflow/artwork}:/artwork
      # ↓ EDIT THIS: where opusflow reads and writes your actual music —
      # everything lives somewhere under this one folder (e.g.
      # /volume1/opusflow-data on a Synology). There's no separate
      # "library root" or "import source" setting anymore: use the
      # in-app Libraries page to create a library at any path under here,
      # and the Import page's "browse a server folder" to pick a source
      # anywhere under here too. No default — replace the whole ${...}
      # token with your path, or the stack refuses to start and tells you so.
      - ${OPUSFLOW_DATA_DIR:?set OPUSFLOW_DATA_DIR to a host path for your music data, e.g. /volume1/opusflow-data}:/data
    ports:
      # ↓ EDIT THIS if 8090 is already taken on your machine (DSM claims
      # 5000/5001 itself, and some packages default to 8080). Which build
      # is running: the About page (last link in the top nav) reports the
      # version — include it when reporting a misbehaving nightly.
      - "8090:8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opusflow
      POSTGRES_DB: opusflow
      # No password: postgres isn't reachable from outside this compose
      # network (no ports: mapping below), so trust authentication is safe
      # here and there's nothing to leak into this file or keep in sync.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # ↓ EDIT THIS: where the Postgres database itself lives on the host
      # (e.g. /volume1/docker/opusflow/pgdata on a Synology). No default —
      # replace the whole ${...} token with your path, or the stack refuses
      # to start and tells you so.
      - ${OPUSFLOW_PGDATA_DIR:?set OPUSFLOW_PGDATA_DIR to a host path for the Postgres database, e.g. /volume1/docker/opusflow/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opusflow -d opusflow"]
      interval: 5s
      timeout: 3s
      retries: 10
